x-allow-minio: &allow-minio
  depends_on:
    s3-init:
      condition: service_completed_successfully
  volumes:
    - ./tests/allow_minio.sh:/etc/cvat/init.d/allow_minio.sh:ro

services:
  cvat_server: *allow-minio
  cvat_worker_export: *allow-minio
  cvat_worker_import: *allow-minio
  cvat_worker_chunks: *allow-minio

  minio:
    # Keep the historical service name and endpoint used by the test fixtures,
    # while using Moto because the pinned MinIO images are no longer available.
    image: &moto-image ghcr.io/getmoto/motoserver:5.2.3
    hostname: minio
    restart: always
    expose:
      - "9000"
    ports:
      - "9000:9000"
    environment:
      MOTO_PORT: "9000"
      S3_IGNORE_SUBDOMAIN_BUCKETNAME: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:9000/')
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      cvat:
        aliases:
          - minio

  s3-init:
    image: *moto-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "minio_access_key"
      AWS_SECRET_ACCESS_KEY: "minio_secret_key"
      AWS_DEFAULT_REGION: "us-east-1"
    volumes:
      - ./tests/init_s3.py:/mnt/init_s3.py:ro
      - ./tests/cypress/e2e/actions_tasks/assets/case_65_manifest/:/mnt/images_with_manifest:ro
      - ./tests/mounted_file_share/:/mnt/mounted_file_share:ro
    networks:
      - cvat
    entrypoint:
      - python
      - /mnt/init_s3.py
